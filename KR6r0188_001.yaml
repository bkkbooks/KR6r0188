body:
  text: 張建木一事略宗喀巴大師原名叫賢慧稱吉祥是受沙彌戒時取的宗喀巴是後來人對他的一個尊稱宗喀是距離青海西寧五十里的一個地名巴是藏語的語尾之一宗喀巴原義即是宗喀地方的人大師於一三五七年元順帝至正十七年降生於宗喀的一個佛教家庭他的父親名叫達爾喀且魯崩格母親名叫馨茂阿卻兩個人都是很虔誠的佛教徒他的同族人也全部信仰三寶族中還有不少出家人大師三歲時法王迦瑪巴遊戲金剛應元順帝的邀請由西藏到內地去中途經過大師的故鄉見到大師器宇非凡因此授給他近事戒賜號慶喜藏在這一年裏附近有一位修大威德得成就的喇嘛名叫敦珠仁欽施捨給大師的父親好多馬羊等財物請求把他這個小孩送給他大師的父親很高興地答應了他從此直至入藏以前大師依止敦珠仁欽而住學了很多經論並且受了密教的灌頂他的密號叫做不空金剛七歲時依敦珠仁欽受沙彌戒為了進一步深造十六歲時一三七二辭別敦珠仁欽前往西藏十七歲到達拉薩東面的止公山林在止公寺間阿仁波切座前聽受大乘發心儀軌大印五法那若六法等極深的教法以後又到拉薩西面的極樂寺從吉祥獅子和善滿所聞經論又以功德海和烏錦巴為正副阿闍黎學習現觀莊嚴論又依曼殊寶大善知識聽受大乘莊嚴論等慈尊諸論這樣幾年之內學習了好多顯密經論十九歲在那塘時學習現觀莊嚴論其中多引俱舍之文比較難懂因此發心學俱舍在那裏他從義賢譯師聽受意樂賢的俱舍釋但他還不滿足一天在一位格西那裏看到慶喜祥的現觀莊嚴論釋比他過去所學的注解明晰易解又看到其中有引俱舍論處論釋得也很清楚因此第二年夏天他就到澤欽請慶喜祥講一遍現觀莊嚴論慶喜祥又介紹他到仁達巴那裏聽聞俱舍和入中論仁達巴的學問修持都極好因此成為宗喀巴大師一生中最重要的師長那年秋季從大譯師菩提頂受集論冬天從慧明大律師聽受毘奈耶根本經及其釋論二十二歲仁達巴為大師評講集論一遍那年又以釋量論為主兼講入中論並講授律藏等經論同時依金剛寶聽聞歡喜金剛第二品薩迦派的注釋次年春季夏季大師又請仁達巴講釋量論一次並聽受集密本續和五種次第秋間從福稱喇嘛聽受多種經論以後閉關專修並閱釋量論的廣釋對於法稱的理論生起無量不可抑制的猛利信心過去西藏人僅僅知道因門系辯論方式現在大師看出陳那集量法稱釋量論攝盡一切上下諸乘修行次第因此認為這些著作乃是成佛解脫之道二十四歲那年的春天大師到那塘那時義賢正著釋量論的注解大師就在那裏聽受一遍夏季大師在那塘立釋量集論俱舍戒律四部之宗同時從一些大德受好多密法秋間在藹寺從空賢學詩詞同時依止仁達巴溫習入中論釋量論集論俱舍論等又重新聽受一遍現觀莊嚴論和戒律過去沒得到傳承和講解的中觀宗重要經論這時從那塘住持慶喜幢受得一切傳承又請極樂寺妙寶講授一次當時西藏得中觀宗諸論的傳承的寥寥可數可是現在到處都有這都是由於大師得到傳承加以弘揚的緣故這一段僅僅是把大師所學的經論略舉幾個例子實際上所學絕不限於這些大概藏中所有經論大師或者兼聽講授或者僅受傳承沒有沒接觸過的大師在學習圓滿的時期改戴黃帽以後他的弟子們也就隨著戴黃帽因此形成黃帽派黃帽原是持律者所戴據土官宗派源流說貢巴饒塞朗達瑪滅法後復興佛法的大律師送廬梅到西藏的時候把自己戴著的一頂黃帽子送給廬梅說是戴上這個就想起我來了因此過去一些大持律者都戴黃帽子宗喀巴想振興衰頹的戒律帽子的顏色與過去的持律者們取得一致採用黃色德格版一一一二頁據此黃帽並不自宗喀巴始宗喀巴採用黃帽主要的用意是興復戒律其中並沒有多少改革宗教的意味以後大師在雅壟地方恭請錯欽薄寺住持戒寶律師為親教師錯巴吉津寺住持慧依為羯磨阿闍黎錯巴吉津的維那福德金剛為屏教阿闍黎還有兩個寺院的持律比丘為證戒僧眾正受比丘戒受比丘戒後曾從名稱菩提請問法義印證所學並聽受道果的傳受那若六法帕摩主巴與世間依怙的著述以後到聞道場講現觀莊嚴因明中觀諸論此後到前藏住在剎寺閱讀大藏引生無量觀察妙慧他三十一歲那年造現觀莊嚴論獅子賢釋廣疏取名善說金鬘以後一兩年之內除了自己修習以外在各地講了很多大小乘經論如在賈城為七十位左右善知識講現觀莊嚴論入中論集論等在貢迦的五明道場為貢迦法王和七十多位三藏法師講現觀莊嚴論因明集論俱舍比丘戒入中論等住在門喀札喜棟寺的時候一天晚上和大家一起烤火談到西藏學者的傳記有人說從前慧獅子在一個法會中每日能講十一種經論在西藏在一個時期中所講的以他為最多當時霞頓等善知識請求大師也這樣講大師說略加努力也許可以作得到於是就答應了他們隨即閉關二十一天閱讀經論出關以後的前幾天略講了一些印土論典以後十五部論同日開講每天從早到晚講十五座沒有間缺其中小部頭的論先講完了兩部於是後來又加講兩部一共講了十七部即是因明疏現觀莊嚴論集論俱舍戒律慈氏後四論辨中邊辨法法性大乘莊嚴經論寶性論中觀五論中論迴諍六十頌七十頌細研入中論四百論入行論講這十七部論時每部論各依一種西藏人所著的廣釋為根本其他若干注釋為附屬加以抉擇經歷三個月法會才圓滿每天晚座講完仍舊修大威德二種次第未曾間斷以後大師曾在一法會中同時講二十一部大論又在專修的時候曾合講二十九部大論一切緇素嘆為希有大師三十四歲時打算學金剛乘講授灌頂密傳事相等法於是到了後藏住在努卻壟從錯寺住持稱友受五種次第密乘法類又會見一位西寧籍的通達中觀的喇嘛名叫精進獅子的詳談法義這一期間大師了知中觀月稱和清辯的差別而以月稱論師為解釋龍樹論義的正宗大師以前所學偏重顯教經論今後打算專攻密法以便專修於是到仰垛的德欽寺從布頓大師的上首弟子法祥學習時輪疏釋修行事相六加行法等以後大師打算學全部瑜伽的傳承解釋和事相等未學經以前要先把事相學會才好於是從布頓的弟子以善巧瑜伽事相而著名的瑜伽師壽自在學習對於金剛界祥勝和金剛頂等瑜伽部一切大曼陀羅的畫規舞讚結壇結印等學習得都很純熟以後又回到法祥那裏請受金剛鬘的灌頂傳承密授指導舞讚畫壇等一切事相又學到金剛手大輪等灌頂傳承教誡以後又到霞魯從大持咒者瓊波雷巴聽受瑜伽部諸大曼陀羅等藏土清淨灌頂傳承未斷的下部密法並聽受魯伊巴派和那伯巴派勝樂等無上瑜伽無量法義學習完畢仍舊回到法祥座前聽受金剛心釋金剛手讚釋那若大疏等時輪的各種注解並全部聽受布頓所造二派集密的各種釋疏以後又從三藏大法師幢稱抉擇瑜伽部舞讚等事相也聽受經法特別聽受布頓所造的金剛出生大疏瑜伽部根本經攝實相經金剛頂經祥勝經淨惡趣續顯實相論憍薩羅莊嚴論祥勝經大疏等無量的重要經續和注釋三十六歲時赴拉薩朝釋迦佛像以後一二年內捨事閉關專修三十八歲培修精基地方的慈氏菩薩殿第二年住在羅札為該地僧俗講多種教法四十歲時從法依大師聽聞菩提道燈論釋集密五種次第法等這一年中曾往孃的金沙奔巴行廣大供養在那裏講比丘戒律安立無量眾生住於戒律自此以後即使漉水觸火這一些瑣事也要依律而行徒眾也跟隨著這樣作因此以後黃教最尊崇戒律這一年在若種安居時大弟子達瑪仁欽阿闍黎初次謁見達瑪仁欽最初看不起宗喀巴但聽了大師講經之後對大師很快地生起了信心誓從大師為隨身弟子後來大師圓寂即由他繼承法位以後由孃回到俄喀住拉頂阿蘭若一年自修教他這年之內了解佛護月稱一派中觀見的究竟生大歡喜因此造論稱讚如來所說緣起性空的甚深道理這部論通稱緣起讚四十四歲那年的春天到迦瓦棟在無量海會之中講說菩薩戒品事師五十頌和密宗十四根本戒等以後與仁達巴共赴若珍冬季在若珍廣演大乘莊嚴論辨中邊論集論瑜伽師地論聲聞地諸大乘法又為仁達巴講集密月稱釋和中觀論仁達巴也為大師講六十如理論集密五次第法和中觀月稱釋的中見等深細修法第二年夏與仁達巴勝依法王在囊則敦寺安居時抉擇正法廣弘戒律四十六歲時造菩提道次第廣論這部著作總依慈氏現觀莊嚴論別依阿底峽菩提道燈論開演三士道次第後半別明止觀更是大師的精心著作以後又造菩薩地戒品廣釋密宗根本罪釋事師五十頌釋等四十七歲時宣講現觀莊嚴論講授完畢令弟子達瑪仁欽依照此次所講的要義而造釋論達瑪仁欽即遵囑造廣釋心藏經嚴論即是現在西藏講現觀莊嚴論的根本依四十八歲時移錫雷朴寺廣演法稱論師的因明廣釋達瑪仁欽記而造論以後到俄喀住慈氏洲講經因勝依法王等的勸請造密宗道次第總明四部密宗的全體這部論與菩提道次第一明密乘一明顯教是宗喀巴平生最偉大的兩部著作五十一歲時赴前藏在塞若卻頂安居大弟子克主傑初次參謁大師大師為授大威德灌頂這一年造中觀論廣釋五十二歲時造辨了不了義論這一年永樂六年一四八六月明成祖派大臣四人隨員數百人到西藏迎請大師來漢地為大師婉言謝絕大臣們轉請派一上首弟子應成祖之請大師於是命令大弟子釋迦智前往京師釋迦智見了皇帝以後被封為大慈法王這一年中觀論廣釋造訖在六百多三藏法師的聚會中廣為宣演此外還講了中論辨了不了義四百頌論密宗道次第密宗根本三昧耶事師五十頌等這一年培修拉薩大招寺第二年正月在大招寺興起大法會又應徒眾之請興建根本道場迦登寺建立房舍的軌則完全合乎戒律所說下至廚房都依照戒律建築第二年來到格登寺做一些開光等事情並講述菩提道次第集密月稱釋及五種次第集論瑜伽師地論因明論等又造集密四天女請問經和集智金剛經二書的注釋五種次第的注解也是第二年內在這個道場內造成的五十八歲時藏王名稱幢迎請大師赴聞地的札西朵喀安居為數百三藏法師宣講中觀因明菩提道次第入菩提行論等大弟子根敦主巴即在此時此地初次參謁大師以後回到格登寺著魯伊巴勝樂大疏圓滿次第四瑜伽廣略講義修法又對勘集密根本經和注解有所注述五十九歲時因以前所著菩提道次第廣論卷帙過於浩繁一般人不易誦持於是另造菩提道次第略論六十二歲在格登寺宣講集密釋箋幾種釋續五種次第廣解六支加行廣解時輪無垢光大疏中觀因明勝樂菩提道次第等無量甚深大法這一年入中論廣釋造訖歲末大師令刻集密根本經第二年刻好六十三歲一四一九時宣講勝樂輪根本經等顯密諸法勝樂輪根本經釋也在這一年作成如是在講經行化的生活中這一代大師於十月二十五日圓寂宗喀巴大師的平生在學問修持各方面都具有最高的造詣對於教理他總結大小乘顯密一切教誡理論而自成一家之言他一方面有括囊大典網羅眾家的氣度一方面又有不容假借混淆的見地如抉擇佛教各宗的見地之後以中觀為正宗抉擇中觀各派之後以月稱為皈依詳見菩提道次第廣論觀品和辨了不了義論他的著述極豐富現存的有十八帙包括傳記和口義對於戒律他能嚴格地遵守矯正舊派佛教的流弊他的德行又極高足以領袖群倫因此他所創的格魯派至今為西藏第一大教派在時間上講這一派流行了六百年在空間上講不但流行於西藏本土而且遠及青康漢地蒙古如果咱們把宗喀巴的傳記稍事涉獵就知道這些現象不是沒有原因的二宗喀巴的弟子宗喀巴的弟子多到不可勝計現在僅將最著名而且對弘揚宗喀巴教法最有關係的幾位大弟子列舉如下嘉曹傑一三六四一四三二名叫達瑪仁欽最初在薩迦派出家親近仁達巴等諸大善知識以十部大論在各寺立宗最初聽到宗喀巴大師的名聲自己不相信以後聽到大師講經慢心才降低下來願作弟子十二年中受學一切顯密教授宗喀巴圓寂以後他繼承法位為迦登寺的第一代坐床者以後依據大師的成規以戒律為本兼弘集論俱舍因明現觀莊嚴入中論等大師的一切顯密善說無不盡力宣揚在位十三年一四一九一四三一之內宗喀巴的弟子把他當作宗喀巴一樣侍奉克主傑一三八五一四三八原名格雷倍桑最初也在薩迦派出家親近仁達瓦和達瑪仁欽也立過十部大論宗後來因仁達瓦的介紹而為宗喀巴的弟子宗喀巴圓寂後到後藏弘揚宗喀巴的顯密教法以後被達瑪仁欽迎回迦登寺繼承法位凡八年他的學說完全祖述宗喀巴不糅雜絲毫其他說法非但摧伏一切外道外派的論難即使大師弟子中見地稍有不同於宗喀巴的一定要盡力破除妙音法王一三七九一四四八名叫札西倍敦在宗喀巴的弟子中稱為聞持第一受持顯密經論一百八部講說的時候不需要經本只靠背誦甲午年永樂十二年一四一四受宗喀巴大師的囑咐於次年建立哲繃寺講授中觀因明現觀莊嚴論等都以宗喀巴為依歸攝受弟子極多因派七位阿闍黎分別宣揚教法所以該寺形成七大院其後合併為多聞明慧洲廣樂密咒四大院大慈法王一三五四一四三五名叫釋迦智曾經代表宗喀巴到南京謁見明成祖回藏後依宗喀巴命創建色拉寺以後又晉京作永樂宣德兩代的國師把黃教傳布到蒙古和漢地是為漢地有黃教之始根敦主巴一三九一一四七五或七三最初依止慧獅子其後為宗喀巴的弟子並從達瑪仁欽克主傑問法後來隨慧獅子到後藏弘法在那裏創建札什倫布寺住持三十八年暇時就到後藏各地廣講經論這個寺院最初分為三個院到班禪善慧法幢增添了一所密咒院人才眾多為後藏第一大寺歷代班禪就是該寺的寺主上慧賢阿里人學成後回阿里莽域建立達摩等寺從此宗喀巴的教法遍布於阿里下慧賢西康人起初在色拉寺求學曾為該寺的副講阿闍黎回西康後在昌都建立寺院從此黃教盛行於西康
